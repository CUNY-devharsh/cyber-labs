# Builds the Kali cloud machine image and runs a few lab steps in it. A change
# that breaks the image then fails here, before a student's codespace does.
name: Check the Kali image

on:
  push:
    branches: [main]
    paths: [".devcontainer/kali/**", ".github/workflows/kali-image.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Build the terminal image
        run: docker build --target terminal -t kali-terminal .devcontainer/kali
      - name: Run lab steps in it
        run: |
          docker run --rm --cap-add NET_ADMIN --cap-add NET_RAW --cap-add SYS_PTRACE \
            --security-opt seccomp=unconfined --hostname kali kali-terminal bash -ec '
              gh --version | head -1
              sudo systemctl start ssh
              sleep 1
              test "$(systemctl is-active ssh)" = active
              ss -ltn | grep -q ":22 "
              sudo systemctl disable --now ssh
              for t in strace ltrace upx r2 readpe yara gdb g++ aircrack-ng sshd nft tshark; do
                command -v "$t" >/dev/null || { echo "missing $t"; exit 1; }
              done
              python3 -c "import pandas, numpy, matplotlib, flask"
              printf "int main(){return 0;}\n" > /tmp/t.c
              gcc -o /tmp/t /tmp/t.c
              gdb -q -batch -ex run /tmp/t 2>&1 | tee /tmp/gdb.out
              if grep -q "Error disabling address space randomization" /tmp/gdb.out; then
                echo "gdb cannot turn off address randomization"; exit 1
              fi
              echo ALL_OK'
