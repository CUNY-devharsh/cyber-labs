# ttyS0 is the control line between the web page and the machine. The page
# uses it to set the clock after a saved state is restored. It is a quiet root
# shell with no prompt and no echo, and it is never shown to the student.
[Service]
Environment=PS1=
ExecStart=
ExecStart=-/bin/sh -c 'stty -echo -onlcr; echo LAB_CONTROL_READY; exec /bin/bash --noprofile --norc --noediting'
